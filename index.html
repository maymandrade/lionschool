<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
  <script src="./js/app.js" type="module"></script>
  <title>Lion School</title>
</head>

<body class="min-h-screen flex flex-col">
  <header class="bg-[#3347B0] flex h-24 md:h-10 w-full justify-around md:justify-between md:p-12 items-center">
    <img src="./img/logo.png" alt="logo lion School" />
    <button id="botao-sair" class="md:flex items-center md:gap-4">
      <img src="./img/sair.png" alt="icone sair" class="h-8 md:h-10" />
      <span id='span-sair' class="hidden md:flex text-white text-4xl">Sair</span>
    </button>
  </header>

  <!-- <main id="main" class="flex flex-1 justify-between"> -->
  <main id="main" class=" flex flex-1 items-center justify-center">

    <section id="tela-inicial" class="flex flex-col lg:flex-row p-16 gap-12 items-center justify-center">

      <div class="flex flex-col gap-16 items-center">
        <h1 class="text-[clamp(2rem,4vw,4rem)] font-light text-center lg:text-left">
          Escolha um
          <span class="text-[#3347B0] font-bold">curso</span>
          <br />
          para gerenciar
        </h1>
        <img class="hidden lg:block max-w-md w-full h-auto min-w-md" src="./img/dispositivos.png" alt="dispositivos" />
      </div>

      <div class="">
        <img src="./img/studant.png" alt="estudante" class="" />
      </div>

      <div id="botoes" class="flex flex-col gap-16 p-8"></div>
  </main>

  <footer
    class="bg-[#3347B0] flex flex-col md:flex-row items-center md:justify-between justify-center md:px-24 py-5 gap-8">

    <div class="flex order-1 flex-col lg:items-start gap-4 items-center">
      <div class="flex gap-5">
        <img src="./img/telefone.png" alt="telefone" />
        <span class="text-white">(11) 4774-4700</span>
      </div>

      <div class="flex gap-5">
        <img src="./img/icon-email.png" alt="email" />
        <span class="text-white">lionschool@gmail.com</span>
      </div>

      <div class="flex gap-5">
        <img src="./img/local.png" alt="localidade" />
        <span class="text-white">Rua tcc, 211, Centro, Jandira</span>
      </div>
    </div>

    <div class="flex order-2 md:order-3 lg:order-3 gap-8">
      <div class="flex border-2 boder-white rounded-full h-12 w-12 items-center justify-center">
        <img src="./img/youtube.png" alt="youtube" />
      </div>

      <div class="flex border-2 boder-white rounded-full h-12 w-12 items-center justify-center">
        <img src="./img/twitter.png" alt="twitter" />
      </div>

      <div class="flex border-2 boder-white rounded-full h-12 w-12 items-center justify-center">
        <img src="./img/instagram.png" alt="instagram" />
      </div>

      <div class="flex border-2 boder-white rounded-full h-12 w-12 items-center justify-center">
        <img src="./img/facebook.png" alt="facebook" />
      </div>
    </div>

    <span class="order-3 md:order-2 lg:order-2 text-xs md:text-xl text-center text-white">Copyright © 2026
      |
      Mayara Martins</span>
  </footer>
</body>

</html>
