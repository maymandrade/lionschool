<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
  <title>Lion School</title>
</head>

<body class="min-h-screen flex flex-col">
  <header class="bg-[#3347B0] flex h-24 md:h-10 w-full justify-around md:justify-between md:p-12 items-center">
    <img src="./img/logo.png" alt="logo lion School" />
    <button class="md:flex items-center md:gap-4">
      <img src="./img/sair.png" alt="icone sair" class="h-8 md:h-10" />
      <span class="hidden md:flex text-white text-4xl">Sair</span>
    </button>
  </header>

  <main class=" flex flex-1 items-center justify-center">

    <div class="flex flex-col lg:flex-row p-16 gap-12 items-center justify-center">

      <div class="flex flex-col gap-16 items-center">
        <h1 class="text-[clamp(2rem,4vw,4rem)] font-light text-center lg:text-left">
          Escolha um
          <span class="text-[#3347B0] font-bold">curso</span>
          <br />
          para gerenciar
        </h1>
        <img class="hidden lg:block max-w-md w-full h-auto min-w-md" src="./img/dispositivos.png" alt="dispositivos" />
      </div>

      <div class="">
        <img src="./img/studant.png" alt="estudante" class="" />
      </div>

      <div class="flex flex-col gap-16 p-8">
        <button class="bg-[#3347B0] gap-16 h-[clamp(175px,40vw,200px)] w-[clamp(175px,40vw,400px)] shadow-2xl shadow-[15px_15px_6px_#3347B050] md:shadow-[15px_15px_0_#3347B050] flex items-center justify-center
         transition-all duration-300 hover:shadow-[15px_15px_6px_#3347B050] hover:-translate-y-2">
          <img src="./img/desenvolvimento.png" alt="desenvolvimento de sistemas" class="hidden md:flex" />
          <h1 class="text-6xl text-white">DS</h1>
        </button>
        <button class="bg-[#3347B0] gap-16 h-[clamp(175px,40vw,200px)] w-[clamp(175px,40vw,400px)] shadow-2xl shadow-[15px_15px_6px_#3347B050] md:shadow-[15px_15px_0_#3347B050] flex items-center justify-center
          transition-all duration-300 hover:shadow-[15px_15px_6px_#3347B050] hover:-translate-y-2">
          <img src="./img/redes.png" alt="redes" class="hidden md:flex" />
          <h1 class="text-6xl text-white">RDS</h1>
        </button>
      </div>
    </div>
  </main>

  <footer class="bg-[#3347B0] flex flex-col md:flex-row items-center md:justify-between px-24 py-5 gap-8">

    <div class="flex order-1 flex-col items-center lg:items-start gap-4">
      <div class="flex gap-5">
        <img src="./img/telefone.png" alt="telefone" />
        <span class="text-white">(11) 4774-4700</span>
      </div>

      <div class="flex gap-5">
        <img src="./img/icon-email.png" alt="email" />
        <span class="text-white">lionschool@gmail.com</span>
      </div>

      <div class="flex gap-5">
        <img src="./img/local.png" alt="localidade" />
        <span class="text-white">Rua tcc, 211, Centro, Jandira</span>
      </div>
    </div>

    <div class="flex order-2 md:order-3 lg:order-3 gap-8">
      <div class="flex border-2 boder-white rounded-full h-12 w-12 items-center justify-center">
        <img src="./img/youtube.png" alt="youtube" />
      </div>

      <div class="flex border-2 boder-white rounded-full h-12 w-12 items-center justify-center">
        <img src="./img/twitter.png" alt="twitter" />
      </div>

      <div class="flex border-2 boder-white rounded-full h-12 w-12 items-center justify-center">
        <img src="./img/instagram.png" alt="instagram" />
      </div>

      <div class="flex border-2 boder-white rounded-full h-12 w-12 items-center justify-center">
        <img src="./img/facebook.png" alt="facebook" />
      </div>
    </div>

    <span class="order-3 md:order-2 lg:order-2 text-xs md:text-xl text-white">Copyright © 2026
      |
      Mayara
      Martins</span>
  </footer>
</body>

</html>
